[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hevy-garmin"
version = "0.1.0"
description = "Guided wizard to sync Hevy strength routines to Garmin Connect"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "garminconnect[workout]>=0.3.8",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
hevy-garmin = "app.main:main"

[project.urls]
Homepage = "https://github.com/arturguimaraes/hevy-garmin-integration"
Repository = "https://github.com/arturguimaraes/hevy-garmin-integration"

[tool.setuptools.packages.find]
where = ["backend"]

# The frontend build output is copied here by scripts/build.sh before packaging.
[tool.setuptools.package-data]
"app" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
